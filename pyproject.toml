[project]
name = "wiqaya"
version = "0.1.0"
description = "Wiqaya (وقاية): scan a food label, check it against your family's allergies. Gemma 4 reads the label; the check runs on your phone."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Wiqaya team" }]
keywords = ["allergy", "food", "labels", "gemma", "jordan", "health", "open-food-facts"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.10",
  "pillow>=11.0",
  "cryptography>=43",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
bench = ["playwright>=1.45"]

[project.scripts]
wiqaya = "wiqaya.cli:main"

[project.urls]
Homepage = "https://github.com/MasriAm/wiqaya"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wiqaya*"]

[tool.setuptools.package-data]
wiqaya = ["data/*.json", "web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
